name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_run:
    workflows:
      - sync infused formulae
    types:
      - completed
    branches:
      - main

jobs:
  test-bot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Install standalone linters on Intel macOS
        if: matrix.os == 'macos-15-intel'
        run: |
          version="$(brew ruby -e 'require "formula"; puts Formula["shellcheck"].version')"
          curl --fail --location --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.darwin.x86_64.tar.gz" \
            --output "${RUNNER_TEMP}/shellcheck.tar.gz"
          tar -xzf "${RUNNER_TEMP}/shellcheck.tar.gz" -C "${RUNNER_TEMP}"
          install -m 755 "${RUNNER_TEMP}/shellcheck-v${version}/shellcheck" "$(brew --prefix)/bin/shellcheck"
          version="$(brew ruby -e 'require "formula"; puts Formula["actionlint"].version')"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_darwin_amd64.tar.gz" \
            --output "${RUNNER_TEMP}/actionlint.tar.gz"
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          install -m 755 "${RUNNER_TEMP}/actionlint" "$(brew --prefix)/bin/actionlint"

      - run: brew test-bot --only-tap-syntax --verbose
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
